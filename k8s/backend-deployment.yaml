apiVersion : apps/v1
kind: Deployment
metadata:
  name: api
  namespace: workshop
  labels:
     role: api
     env: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      role: api
  template:
    metadata:
      labels:
        role: api
           
    spec:
      containers:
        - name: api
          image: 928430095864.dkr.ecr.us-west-2.amazonaws.com/project-k8s:backend
          imagePullPolicy: Always
          env:
            - name: MONGO_CONN_STR
              value: mongodb://mongodb-svc:27017/todo?directConnection=true
            - name:  MONGO_USERNAME
              valueFrom:
               secretKeyRef:
                 name: mongo-sec
                 key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-sec
                  key: password
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path : /ok
              port : 8080
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ok
              port: 8080
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ok
              port: 8080
            periodSeconds: 5


